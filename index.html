<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payday Ledger</title>
<meta name="description" content="Paycheck-to-paycheck budgeting with an honest coach. Your data stays on your phone.">
<meta name="theme-color" content="#111615">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Payday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face { font-family: "Press Start 2P"; src: url("fonts/press-start-2p.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "VT323"; src: url("fonts/vt323.woff2") format("woff2"); font-display: swap; }
/* Layout: one-column phone app styled as an 8-bit RPG. Sticky title bar with HUD, scrolling view, fixed tab bar, bottom sheets as dialog boxes. Dark only. */
:root {
  --bg: #111615;
  --surface: #1A2120;
  --surface-2: #252E2C;
  --line: #3B4A47;
  --edge: #060908;
  --ink: #EEF2E8;
  --ink-2: #C2CCC2;
  --muted: #84928C;
  --accent: #3EE08F;
  --accent-ink: #062014;
  --accent-soft: #16352A;
  --gold: #FFCC33;
  --heart: #FF4D6D;
  --arti: #8EE3F0;
  --arti-soft: #173238;
  --need: #7FB2FF;
  --chart-income: #22A87A;
  --chart-spend: #5B7FE0;
  --want: #FF8C42;
  --want-soft: #3E2418;
  --good: #3EE08F;
  --warn: #FFC23D;
  --warn-soft: #3D3012;
  --bad: #FF5C7A;
  --bad-soft: #401A2A;
  --scrim: rgba(3, 6, 5, .74);
  --f-pixel: "Press Start 2P", ui-monospace, monospace;
  --f-body: "VT323", ui-monospace, "SF Mono", Menlo, monospace;
  --f-display: var(--f-pixel);
  --f-mono: var(--f-body);
  --bevel: inset 3px 3px 0 rgba(255, 255, 255, .07), inset -3px -3px 0 rgba(0, 0, 0, .35);
  --tab-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 21px; line-height: 1.15; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 200; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .09) 0 1px, transparent 1px 3px); }
button, input, select, textarea { font: inherit; color: inherit; }
button, label, a { touch-action: manipulation; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img.sprite, canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
img.sprite { width: 20px; height: 20px; vertical-align: -4px; }
img.inn-face { width: 40px; height: 40px; }
.num { font-family: var(--f-body); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-pixel); font-weight: 400; margin: 0; line-height: 1.45; text-wrap: balance; }
p { margin: 0; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 3px solid var(--edge); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 8px; }
.top h1 { font-size: 14px; color: var(--gold); text-shadow: 2px 2px 0 var(--edge); }
.top .eyebrow { font-size: 17px; color: var(--muted); }
.icon-btn { width: 42px; height: 42px; border: 3px solid var(--edge); background: var(--surface-2); box-shadow: var(--bevel); display: grid; place-items: center; flex: none; color: var(--ink-2); padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn img { width: 24px; height: 24px; }
.icon-btn:active { transform: translateY(2px); box-shadow: none; }

/* HUD */
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--f-pixel); font-size: 10px; padding-bottom: 8px; }
.hud .lv { color: var(--gold); }
.hud .hearts { display: flex; gap: 2px; }
.hud .hearts img { width: 16px; height: 16px; }
.hud .gems { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); }
.hud .gems img, .hud .streak img { width: 14px; height: 14px; }
.hud .streak { display: inline-flex; align-items: center; gap: 4px; color: var(--want); }
.xpbar { height: 10px; background: var(--edge); border: 2px solid var(--line); position: relative; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--gold) 0 6px, #E0A800 6px 8px); }
.hpbar { height: 12px; background: var(--edge); border: 2px solid var(--line); }
.hpbar > i { display: block; height: 100%; background: var(--heart); }

main.wrap, section, .stack, .celebrate { grid-template-columns: minmax(0, 1fr); }
#hud.wrap { display: block; padding-block: 0; }
main.wrap { padding-block: 12px calc(var(--tab-h) + 100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
section { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head h2 { font-size: 12px; color: var(--ink); }
.link { background: none; border: 0; color: var(--accent); padding: 4px 0; font-family: var(--f-body); font-size: 20px; text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--surface); border: 3px solid var(--line); box-shadow: var(--bevel); padding: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 18px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 8px; }

/* Arti, the lantern sprite */
.arti { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start; background: var(--arti-soft); border: 3px solid var(--arti); box-shadow: var(--bevel); padding: 12px; }
.arti-face { width: 48px; height: 48px; background: var(--edge); border: 3px solid var(--arti); display: grid; place-items: center; }
.arti-face img { width: 36px; height: 36px; }
.arti-name { font-family: var(--f-pixel); color: var(--arti); font-size: 10px; margin-bottom: 4px; }
.arti-msg { font-size: 20px; line-height: 1.2; }
.arti-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.arti.inline { grid-template-columns: 36px 1fr; padding: 10px; }
.arti.inline .arti-face { width: 36px; height: 36px; }
.arti.inline .arti-face img { width: 26px; height: 26px; }

/* Pay stub hero card */
.stub { background: var(--surface); border: 3px solid var(--line); box-shadow: var(--bevel); }
.stub-top { padding: 12px 14px 10px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 3px dashed var(--line); }
.stub-top .k { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); margin-bottom: 4px; }
.stub-body { padding: 14px; display: grid; gap: 12px; }
.safe-label { font-family: var(--f-pixel); font-size: 9px; color: var(--ink-2); }
.safe-num { font-family: var(--f-pixel); font-size: clamp(30px, 10vw, 40px); line-height: 1.2; color: var(--accent); text-shadow: 3px 3px 0 var(--edge); margin-top: 6px; }
.safe-num.neg { color: var(--bad); }
.safe-sub { color: var(--ink-2); }
.meter { display: flex; height: 12px; background: var(--edge); border: 2px solid var(--line); gap: 2px; }
.meter > i { display: block; height: 100%; }
.ledger { display: grid; gap: 4px; }
.ledger .key { display: flex; align-items: center; gap: 8px; color: var(--ink-2); min-width: 0; }
.dot { width: 10px; height: 10px; flex: none; display: inline-block; }
.ledger .total { border-top: 3px solid var(--line); padding-top: 6px; color: var(--ink); }
.callout { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent-soft); border: 3px solid var(--accent); padding: 10px 12px; flex-wrap: wrap; }
.callout.warn { background: var(--warn-soft); border-color: var(--warn); }
.callout p { flex: 1 1 180px; min-width: 0; }

/* Buttons */
.btn { border: 3px solid var(--edge); background: var(--surface-2); box-shadow: var(--bevel); padding: 8px 14px; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink); text-align: center; font-family: var(--f-pixel); font-size: 10px; line-height: 1.4; }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.gold { background: var(--gold); color: #2A1C00; }
.btn.arti-btn { background: var(--arti); color: #1A0F33; }
.btn.danger { color: var(--bad); background: transparent; border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 10px; font-size: 9px; }
.btn img { width: 16px; height: 16px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 130px; }

/* Lists */
.list { background: var(--surface); border: 3px solid var(--line); box-shadow: var(--bevel); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-top: 3px solid var(--surface-2); background: none; width: 100%; text-align: left; min-width: 0; color: var(--ink); }
.item:first-child { border-top: 0; }
.item .main { flex: 1; min-width: 0; }
.item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 21px; }
.item .sub { font-size: 17px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-family: var(--f-body); white-space: nowrap; font-size: 21px; }
.amt.in { color: var(--good); }
.glyph { width: 38px; height: 38px; display: grid; place-items: center; flex: none; background: var(--edge); border: 3px solid var(--surface-2); color: var(--ink-2); font-family: var(--f-pixel); font-size: 9px; }
.glyph img { width: 28px; height: 28px; }
.glyph.needs { border-color: color-mix(in srgb, var(--need) 55%, var(--edge)); color: var(--need); }
.glyph.wants { border-color: color-mix(in srgb, var(--want) 55%, var(--edge)); color: var(--want); }
.glyph.income, .glyph.save { border-color: color-mix(in srgb, var(--accent) 55%, var(--edge)); color: var(--accent); }
.rcpt-ico { width: 14px; height: 14px; vertical-align: -2px; margin-left: 4px; }
.day-head { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); padding: 4px 2px 0; }
.empty { text-align: center; padding: 22px 14px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-pixel); font-size: 10px; font-weight: 400; line-height: 1.5; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-pixel); font-size: 8px; padding: 4px 6px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; border: 2px solid var(--edge); }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.arti-p { background: var(--arti-soft); color: var(--arti); }
.pill.need-p { background: color-mix(in srgb, var(--need) 20%, var(--surface)); color: var(--need); }
.pill.want-p { background: var(--want-soft); color: var(--want); }
.pill.gold-p { background: #3A2E08; color: var(--gold); }

.bar { height: 12px; background: var(--edge); border: 2px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 3px solid var(--line); box-shadow: var(--bevel); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.stat .k { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); line-height: 1.5; }
.stat .v { font-size: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface); border: 3px solid var(--line); padding: 4px; }
.month-nav button { width: 44px; height: 38px; border: 0; background: none; font-family: var(--f-pixel); font-size: 14px; color: var(--gold); }
.month-nav button:disabled { opacity: .25; cursor: default; }
.month-nav strong { font-family: var(--f-pixel); font-weight: 400; font-size: 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip-btn { border: 3px solid var(--edge); background: var(--surface-2); padding: 8px 10px; font-family: var(--f-pixel); font-size: 8px; white-space: nowrap; color: var(--ink-2); }
.chip-btn[aria-pressed="true"] { background: var(--gold); color: #2A1C00; }

.step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 12px 0; border-top: 3px solid var(--surface-2); }
.step:first-child { border-top: 0; padding-top: 0; }
.step .n { width: 32px; height: 32px; border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--f-pixel); font-size: 10px; color: var(--muted); }
.step.done .n { background: var(--accent); border-color: var(--edge); color: var(--accent-ink); }
.step.now .n { border-color: var(--gold); color: var(--gold); }
.step h3 { font-size: 10px; }
.step p { margin-top: 4px; color: var(--ink-2); font-size: 19px; }
.step .bar { margin-top: 8px; }

.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 13px; }
.chart .grid { stroke: var(--surface-2); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .sel { fill: var(--surface-2); }
.legend { display: flex; gap: 16px; font-size: 18px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.readout { display: flex; gap: 14px; flex-wrap: wrap; font-size: 19px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 3px solid var(--edge); box-shadow: inset 0 3px 0 var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tab-h); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); }
.tab { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 5px; font-family: var(--f-pixel); font-size: 7px; color: var(--muted); }
.tab img { width: 26px; height: 26px; opacity: .6; }
.tab[aria-current="page"] { color: var(--gold); }
.tab { position: relative; }
.tab[data-badge]::after { content: attr(data-badge); position: absolute; top: 4px; left: calc(50% + 8px); min-width: 16px; padding: 3px 4px; background: var(--heart); color: #fff; font-family: var(--f-pixel); font-size: 7px; border: 2px solid var(--edge); }
.tab[aria-current="page"] img { opacity: 1; }
.fab { position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); width: 62px; height: 62px; border: 3px solid var(--edge); background: var(--accent); color: var(--accent-ink); box-shadow: var(--bevel), 4px 4px 0 var(--edge); display: grid; place-items: center; }
.fab:active { transform: translate(2px, 2px); box-shadow: none; }
.fab svg { width: 28px; height: 28px; }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 16px); } }

/* Sheets: 8-bit dialog boxes */
#sheet-root { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade .15s steps(3); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 16px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--bg); border-top: 4px solid var(--ink); box-shadow: 0 -4px 0 var(--edge); padding-block: 12px calc(24px + env(safe-area-inset-bottom, 0px)); animation: rise .2s steps(4); }
.sheet-inner { grid-template-columns: minmax(0, 1fr); max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.grabber { display: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 13px; color: var(--gold); }
@keyframes rise { from { transform: translateY(48px); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .pop, .shake { animation: none !important; } }

form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .field-label { font-family: var(--f-pixel); font-size: 8px; color: var(--ink-2); line-height: 1.5; }
.field input, .field select, .field textarea, .input { width: 100%; min-height: 46px; border: 3px solid var(--line); background: var(--edge); padding: 6px 10px; font-size: 21px; color: var(--ink); border-radius: 0; }
.hint { font-size: 17px; color: var(--muted); font-family: var(--f-body); }
.fields-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fields-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.amount-field { display: flex; align-items: baseline; justify-content: center; gap: 6px; background: var(--edge); border: 3px solid var(--line); padding: 12px; }
.amount-field span { font-family: var(--f-pixel); font-size: 22px; color: var(--gold); }
.amount-field input { border: 0; background: none; width: 100%; max-width: 260px; font-family: var(--f-pixel); font-size: 30px; padding: 0; outline: none; color: var(--ink); }
.work-cost { text-align: center; font-size: 19px; color: var(--want); min-height: 20px; margin-top: -6px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--edge); border: 3px solid var(--line); padding: 3px; gap: 3px; }
.seg button, .seg label { border: 0; background: none; padding: 9px 4px; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); text-align: center; cursor: pointer; position: relative; line-height: 1.5; }
.seg button[aria-pressed="true"], .seg label:has(input:checked) { background: var(--surface-2); color: var(--gold); box-shadow: var(--bevel); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.cat-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-grid label { position: relative; }
.cat-grid input { position: absolute; opacity: 0; }
.cat-grid span { display: inline-block; border: 3px solid var(--line); background: var(--edge); padding: 4px 10px; font-size: 19px; color: var(--ink-2); cursor: pointer; }
.cat-grid input:checked + span { background: var(--gold); color: #2A1C00; border-color: var(--edge); }
.cat-grid input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
.group-label { font-family: var(--f-pixel); font-size: 8px; color: var(--muted); width: 100%; margin-top: 4px; }
.err { color: var(--bad); font-size: 19px; }
.budget-row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; }
.budget-row input { text-align: right; min-height: 42px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle input { width: 24px; height: 24px; accent-color: var(--accent); }
details > summary { cursor: pointer; font-family: var(--f-pixel); font-size: 9px; line-height: 1.6; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 92px); z-index: 60; background: var(--edge); color: var(--ink); padding: 10px 14px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 #000; font-size: 20px; max-width: calc(100% - 32px); text-align: center; }

.hero-onboard { display: grid; gap: 12px; padding-block: 6px; }
.hero-onboard h2 { font-size: 16px; color: var(--gold); line-height: 1.6; text-shadow: 2px 2px 0 var(--edge); }
.hero-onboard p { color: var(--ink-2); max-width: 46ch; }

#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; }
#lock form { width: min(320px, 100%); text-align: center; justify-items: center; }
#lock input { text-align: center; font-size: 30px; letter-spacing: .4em; }

/* Game pieces */
.hero-card { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; }
.hero-card .portrait { width: 76px; height: 76px; background: var(--edge); border: 3px solid var(--gold); display: grid; place-items: center; }
.hero-card .portrait img { width: 60px; height: 60px; }
.hero-card .name { font-family: var(--f-pixel); font-size: 11px; color: var(--ink); line-height: 1.5; }
.hero-card .title { color: var(--gold); font-size: 19px; }
.quest { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 3px solid var(--surface-2); }

.dlg { background: var(--edge); border: 4px solid var(--ink); box-shadow: 0 0 0 3px var(--edge), 6px 6px 0 #000; padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; }

.map-wrap { position: relative; border: 4px solid var(--edge); box-shadow: 0 0 0 3px var(--line); background: #1a3a1a; }

.map-hero { position: absolute; width: 8%; height: auto; scale: var(--face, 1) 1; transition: left .12s linear, top .12s linear; z-index: 2; transform: translate(-50%, -85%); pointer-events: none; animation: bob 1s steps(2) infinite; }

@keyframes bumped { 50% { translate: 3px 0; } }
.map-wrap { cursor: pointer; touch-action: manipulation; }
.explore { display: grid; grid-template-columns: 132px minmax(0, 1fr) 64px; gap: 12px; align-items: center; }
.dpad { display: grid; grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); gap: 3px; }
.dp { border: 3px solid var(--edge); background: var(--surface-2); box-shadow: var(--bevel); color: var(--gold); font-size: 16px; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.dp:active { transform: translateY(2px); box-shadow: none; background: var(--line); }
.dp.up { grid-column: 2; grid-row: 1; } .dp.left { grid-column: 1; grid-row: 2; } .dp.right { grid-column: 3; grid-row: 2; } .dp.down { grid-column: 2; grid-row: 3; }
.abtn { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--edge); background: var(--heart); color: #fff; font-family: var(--f-pixel); font-size: 16px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), 3px 3px 0 var(--edge); }
.abtn:active { transform: translate(2px, 2px); box-shadow: none; }
#map-here { min-height: 2.4em; }
@keyframes bob { 50% { transform: translate(-50%, -95%); } }
.boss { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.boss img { width: 64px; height: 64px; }
.boss .bn { font-family: var(--f-pixel); font-size: 9px; line-height: 1.5; color: var(--bad); }
.shop-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 3px solid var(--surface-2); }
.shop-item:first-child { border-top: 0; }
.shop-item img { width: 36px; height: 36px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 3px solid var(--line); box-shadow: var(--bevel); padding: 10px 6px; display: grid; justify-items: center; gap: 6px; text-align: center; min-width: 0; }
.tile img { width: 44px; height: 44px; }
.tile .tn { font-family: var(--f-pixel); font-size: 7px; line-height: 1.5; }
.tile .td { font-size: 16px; color: var(--muted); line-height: 1.1; }
.tile.locked img { filter: brightness(0) opacity(.5); }
.tile.locked .tn { color: var(--muted); }
.celebrate { text-align: center; display: grid; gap: 12px; justify-items: center; }
.celebrate > * { max-width: 100%; }
.celebrate .big { font-family: var(--f-pixel); font-size: 20px; color: var(--gold); text-shadow: 3px 3px 0 var(--edge); line-height: 1.5; }
.celebrate img { width: 96px; height: 96px; }
.pop { animation: pop .5s steps(5); }
@keyframes pop { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.shake { animation: shake .4s steps(6); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.rcpts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rcpt { width: 64px; height: 64px; border: 3px solid var(--line); background: var(--edge) center / cover no-repeat; padding: 0; position: relative; }
.rcpt-add { width: 64px; height: 64px; border: 3px dashed var(--line); background: var(--edge); display: grid; place-items: center; color: var(--ink-2); font-family: var(--f-pixel); font-size: 7px; text-align: center; line-height: 1.5; cursor: pointer; padding: 4px; }
#viewer { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .94); display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); gap: 10px; }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; touch-action: pinch-zoom; }
#viewer .vbar { display: flex; justify-content: space-between; gap: 10px; }
.event-card { border-color: var(--gold); }
.pet-card { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.pet-box { width: 72px; height: 72px; background: var(--edge); border: 3px solid var(--want); display: grid; place-items: center; }
.pet-box img.sprite { width: 60px; height: 60px; }
.map-pet { width: 6%; }
.payday { position: relative; overflow: hidden; padding-top: 8px; }
.coin-rain { position: absolute; inset: 0; pointer-events: none; }
.coin-drop { position: absolute; top: -24px; width: 18px !important; height: 18px !important; animation: coin-fall 1.6s steps(10) 2 both; }
@keyframes coin-fall { to { transform: translateY(260px); opacity: 0; } }
.chronicle { background: #E9DDB8; color: #2A2116; border: 4px solid #6B4A26; box-shadow: inset 0 0 0 3px #C9B27A, 6px 6px 0 #000; padding: 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.chronicle h3 { font-size: 9px; color: #7A2A16; }
.chronicle ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.chron-head { display: flex; gap: 8px; align-items: center; border-bottom: 3px double #6B4A26; padding-bottom: 10px; }
.chron-head img.sprite { width: 44px; height: 44px; }
.ch-title { font-family: var(--f-pixel); font-size: 9px; line-height: 1.6; color: #2A2116; }
.ch-sub { color: #6B5A3E; font-size: 18px; }
.chron-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.cs { display: grid; border-top: 2px dashed #B49A62; padding-top: 4px; }
.cs span { font-size: 16px; color: #6B5A3E; }
.cs b { font-size: 24px; font-weight: 400; }
.nemesis { display: flex; gap: 10px; align-items: center; }
.nemesis img.sprite { width: 40px; height: 40px; }
.verdict { display: flex; gap: 8px; align-items: flex-start; border-top: 3px double #6B4A26; padding-top: 10px; }
.verdict img.sprite { width: 28px; height: 28px; flex: none; }
@media (prefers-reduced-motion: reduce) { .coin-drop { display: none; } }
.xp-pop { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 120px); transform: translateX(-50%); z-index: 70; font-family: var(--f-pixel); font-size: 12px; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; white-space: nowrap; pointer-events: none; animation: rise-pop 1.6s steps(12) forwards; }
@keyframes rise-pop { 0% { opacity: 0; transform: translate(-50%, 12px); } 15% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }
</style>

<body>
<header class="top"><div class="wrap">
  <div style="min-width:0"><div class="eyebrow" id="top-eyebrow"></div><h1 id="top-title">Payday Ledger</h1></div>
  <div style="display:flex;gap:8px">
    <button class="icon-btn" data-action="sound" aria-label="Sound on or off" id="sound-btn"><img class="sprite" data-sprite="note" alt=""></button>
    <button class="icon-btn" data-action="settings" aria-label="Settings"><img class="sprite" data-sprite="gear" alt=""></button>
  </div>
</div><div class="wrap" id="hud"></div></header>

<main class="wrap" id="view"></main>

<button class="fab" data-action="add" aria-label="Add" id="fab" hidden><svg viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges"><path d="M3 1h2v2h2v2H5v2H3V5H1V3h2z"/></svg></button>

<nav class="tabbar" aria-label="Sections"><div class="wrap">
  <button class="tab" data-action="tab" data-tab="home"><img class="sprite" data-sprite="t-hero" alt="">HERO</button>
  <button class="tab" data-action="tab" data-tab="quests"><img class="sprite" data-sprite="scroll" alt="">QUESTS</button>
  <button class="tab" data-action="tab" data-tab="activity"><img class="sprite" data-sprite="t-journal" alt="">JOURNAL</button>
  <button class="tab" data-action="tab" data-tab="budget"><img class="sprite" data-sprite="t-coin" alt="">BUDGET</button>
  <button class="tab" data-action="tab" data-tab="goals"><img class="sprite" data-sprite="t-map" alt="">MAP</button>
  <button class="tab" data-action="tab" data-tab="insights"><img class="sprite" data-sprite="t-stats" alt="">STATS</button>
</div></nav>

<div id="sheet-root" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="viewer" hidden></div>
<div id="lock" hidden>
  <form data-form="unlock">
    <img class="sprite" data-sprite="arti" alt="" style="width:64px;height:64px;margin-bottom:14px">
    <h2 style="font-size:12px;margin-bottom:6px;color:var(--gold)">ENTER PIN</h2>
    <input class="input" id="lock-pin" name="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <p class="err" id="lock-err" hidden style="margin-top:8px"></p>
    <button class="btn primary block" type="submit" style="margin-top:12px">Unlock</button>
    <button class="link" type="button" data-action="forgot-pin" style="margin-top:8px">Forgot PIN?</button>
  </form>
</div>
